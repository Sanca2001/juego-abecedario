<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Abecedario Kids</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --b1: #5fd0f7;
      --b2: #2f7fd6;
      --ink: #fff;
      --pink: #f0506e;
      --deep: #3f56b8;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
      color: var(--ink);
      background: var(--b2) radial-gradient(ellipse at 50% 30%, var(--b1), var(--b2) 75%) fixed;
      overflow-x: hidden
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: 0;
      color: inherit;
      background: none
    }

    button:focus-visible {
      outline: 4px solid #ffe45c;
      outline-offset: 3px
    }

    .screen {
      display: none;
      min-height: 100vh;
      flex-direction: column;
      padding: 14px clamp(12px, 3vw, 32px) 28px;
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto
    }

    .screen.on {
      display: flex
    }

    h2 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      font-weight: 700;
      text-shadow: 0 2px 0 rgba(0, 0, 0, .12)
    }

    /* barra */
    .nav {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 40% 60% 50% 50%;
      background: #3ed17a;
      font-size: 2rem;
      font-weight: 700;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 0 #1f9c54;
      flex: none;
      transform: rotate(-6deg)
    }

    .logo span {
      color: #ffe45c;
      font-size: 1.3rem;
      margin-top: -10px
    }

    .tabs {
      display: flex;
      gap: clamp(2px, 2vw, 18px);
      margin-left: auto
    }

    .tab {
      width: clamp(44px, 11vw, 72px);
      height: clamp(44px, 11vw, 72px);
      border-radius: 14px;
      font-size: clamp(1.4rem, 5vw, 2rem);
      display: grid;
      place-items: center;
      transition: transform .12s
    }

    .tab:active {
      transform: scale(.88)
    }

    .tab.sel {
      background: var(--deep);
      cursor: default
    }

    .circ {
      width: clamp(48px, 11vw, 66px);
      height: clamp(48px, 11vw, 66px);
      flex: none;
      border-radius: 50%;
      background: #fff;
      font-size: 1.6rem;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 0 rgba(0, 0, 0, .15)
    }

    .circ:active {
      transform: scale(.9)
    }

    /* tarjetas de portada */
    .cards {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 6px 4px 12px;
      scrollbar-width: none
    }

    .cards::-webkit-scrollbar,
    .friends::-webkit-scrollbar {
      display: none
    }

    .gc {
      --c1: #c26cf0;
      --c2: #7d4fe0;
      flex: 0 0 78vw;
      max-width: 340px;
      height: 200px;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      text-align: right;
      padding: 16px 18px;
      scroll-snap-align: center;
      background: linear-gradient(135deg, var(--c1), var(--c2));
      box-shadow: 0 8px 0 rgba(0, 0, 0, .14);
      transition: transform .15s
    }

    .gc:active {
      transform: scale(.97)
    }

    .gc:after {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -45%;
      height: 70%;
      background: rgba(80, 220, 160, .7);
      border-radius: 50%
    }

    .gc .t1 {
      display: block;
      font-size: 1.05rem;
      font-weight: 600;
      position: relative;
      z-index: 1
    }

    .gc .t2 {
      display: block;
      font-size: clamp(1.7rem, 7vw, 2.3rem);
      font-weight: 700;
      line-height: 1;
      position: relative;
      z-index: 1
    }

    .gc .em {
      position: absolute;
      left: 14px;
      top: 38px;
      font-size: 5.4rem;
      line-height: 1;
      z-index: 1;
      animation: bob 2.6s ease-in-out infinite
    }

    .gc .st {
      position: absolute;
      left: 8px;
      top: 8px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--pink);
      display: grid;
      place-items: center;
      z-index: 2;
      font-size: 1.1rem
    }

    .gc .go {
      position: absolute;
      left: 12px;
      bottom: 12px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #fff;
      color: #2f7fd6;
      font-size: 1.3rem;
      display: grid;
      place-items: center;
      z-index: 2
    }

    .gc.b {
      --c1: #8a6cf0;
      --c2: #5a46e0
    }

    .gc.c {
      --c1: #f2748a;
      --c2: #e0507a
    }

    @keyframes bob {
      50% {
        transform: translateY(-8px) rotate(4deg)
      }
    }

    .friends {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 6px 4px 10px;
      scrollbar-width: none
    }

    .fr {
      --c: #f2b632;
      width: clamp(74px, 18vw, 104px);
      aspect-ratio: 1;
      flex: none;
      border-radius: 50%;
      background: var(--c);
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      display: grid;
      place-items: center;
      border: 4px solid #fff;
      box-shadow: 0 5px 0 rgba(0, 0, 0, .15);
      position: relative;
      transition: transform .15s
    }

    .fr:active {
      transform: scale(.9)
    }

    .fr i {
      position: absolute;
      right: -4px;
      bottom: -4px;
      background: #fff;
      color: var(--deep);
      font-style: normal;
      font-weight: 700;
      font-size: .95rem;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center
    }

    /* juego */
    .stars {
      background: rgba(255, 255, 255, .22);
      font-weight: 700;
      font-size: 1.2rem;
      padding: 10px 18px;
      border-radius: 30px;
      white-space: nowrap
    }

    .ttl {
      flex: 1;
      font-size: clamp(1.05rem, 4.5vw, 1.6rem);
      font-weight: 700;
      text-shadow: 0 2px 0 rgba(0, 0, 0, .12);
      line-height: 1.05
    }

    .gm {
      display: grid;
      gap: 18px;
      grid-template-columns: 1fr;
      justify-items: center;
      align-items: start
    }

    .big {
      --c: #a855e0;
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 460px;
      min-height: 210px;
      border-radius: 28px;
      padding: 14px 16px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr auto;
      align-items: center;
      text-align: center;
      background: linear-gradient(135deg, color-mix(in srgb, var(--c), #fff 24%), var(--c));
      box-shadow: 0 8px 0 rgba(0, 0, 0, .16)
    }

    .big:after {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -38%;
      height: 55%;
      background: rgba(80, 220, 160, .55);
      border-radius: 50%
    }

    .big>* {
      position: relative;
      z-index: 1
    }

    .big .L {
      font-size: clamp(4.5rem, 20vw, 8rem);
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 5px 0 rgba(0, 0, 0, .18)
    }

    .big .L i {
      font-style: normal;
      font-size: .55em;
      opacity: .8
    }

    .big .e {
      font-size: clamp(4rem, 17vw, 7rem);
      line-height: 1
    }

    .big .wd {
      grid-column: 1/3;
      font-size: clamp(1.8rem, 8vw, 2.8rem);
      font-weight: 700;
      text-shadow: 0 3px 0 rgba(0, 0, 0, .18)
    }

    .big .st {
      position: absolute;
      left: 10px;
      top: 10px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--pink);
      display: grid;
      place-items: center;
      opacity: .5;
      transition: .2s
    }

    .big .st.on {
      opacity: 1
    }

    .big .sp {
      position: absolute;
      left: 12px;
      bottom: 12px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #fff;
      color: #2f7fd6;
      font-size: 1.5rem;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 0 rgba(0, 0, 0, .18)
    }

    .grid {
      width: 100%;
      max-width: 520px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(6px, 1.6vw, 10px)
    }

    .k {
      --c: #a855e0;
      aspect-ratio: 1;
      border-radius: 22%;
      color: #fff;
      font-weight: 700;
      font-size: clamp(1.3rem, 6.2vw, 2.3rem);
      position: relative;
      text-shadow: 0 2px 0 rgba(0, 0, 0, .2);
      background: linear-gradient(color-mix(in srgb, var(--c), #fff 25%), var(--c));
      box-shadow: 0 5px 0 color-mix(in srgb, var(--c), #000 32%);
      transition: transform .12s, opacity .2s
    }

    .k:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 color-mix(in srgb, var(--c), #000 32%)
    }

    .k.sel {
      outline: 4px solid #fff;
      outline-offset: 2px;
      transform: scale(1.1);
      z-index: 2
    }

    .k.seen:after {
      content: "★";
      position: absolute;
      right: -3px;
      top: -7px;
      font-size: .6em;
      color: #ffe45c;
      text-shadow: 0 0 3px rgba(0, 0, 0, .6)
    }

    .vow .k:not(.v) {
      opacity: .3
    }

    .shake {
      animation: sh .4s
    }

    @keyframes sh {
      25% {
        transform: translateX(-7px)
      }

      75% {
        transform: translateX(7px)
      }
    }

    .pop {
      animation: pp .5s
    }

    @keyframes pp {
      40% {
        transform: scale(1.06) rotate(-1.5deg)
      }
    }

    .cf {
      position: fixed;
      font-size: 1.6rem;
      pointer-events: none;
      z-index: 20;
      animation: fly 1.1s ease-out forwards
    }

    @keyframes fly {
      to {
        transform: translate(var(--dx), var(--dy)) rotate(360deg);
        opacity: 0
      }
    }

    @media (min-width:760px) {
      .cards {
        overflow: visible;
        flex-wrap: nowrap
      }

      .gc {
        flex: 1 1 0;
        max-width: none;
        height: 230px
      }
    }

    @media (min-width:860px) {
      .gm {
        grid-template-columns: 1fr;
        gap: 28px
      }

      .grid {
        grid-template-columns: repeat(9, 1fr);
        max-width: none
      }

      .big {
        min-height: 340px
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>

  <section id="home" class="screen on">
    <div class="nav">

      <div class="logo" aria-hidden="true">A<span>+</span></div>





      <div class="tabs">
        <button class="tab" data-m="learn" aria-label="Aprender letras">▶</button>
        <button class="tab" data-m="find" aria-label="Buscar la letra">🎯</button>
        <button class="tab" data-m="vow" aria-label="Vocales">🅰️</button>
        <span class="tab sel" aria-hidden="true">📖</span>
      </div>
      <button class="circ snd" aria-label="Sonido">🔊</button>
    </div>
    <h2>¡Vamos a jugar!</h2>

    <div class="cards">

      <button class="gc" data-m="learn"><span class="st">⭐</span><span class="em">🐛</span><span class="t1">Toca y
          escucha</span><span class="t2">LAS LETRAS</span><span class="go">▶</span></button>

      <!-- <button class="gc b" data-m="find"><span class="st">⭐</span><span class="em">🦉</span><span
          class="t1">Encuentra</span><span class="t2">LA LETRA</span><span class="go">▶</span></button> -->

      <!-- <button class="gc c" data-m="vow"><span class="st">⭐</span><span class="em">🐘</span><span class="t1">Conoce
          las</span><span class="t2">VOCALES</span><span class="go">▶</span></button> -->
    </div>
    <h2>Tus amigos del abecedario</h2>
    <div class="friends" id="friends"></div>
  </section>

  <section id="game" class="screen">

    <div class="nav">
      <button class="circ" id="menu" aria-label="Inicio">🏠</button>
      <div class="ttl" id="ttl">Las letras</div>
      <div class="stars" id="stars">⭐ 0/27</div>
      <button class="circ snd" aria-label="Sonido">🔊</button>
    </div>

    <div class="gm">
      <div id="hero" style="width:100%;display:flex;justify-content:center;"  ></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <script>
    const LET = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
    const W = {A: ["🐝", "Abeja"], B: ["🐳", "Ballena"], C: ["🏠", "Casa"], D: ["🎲", "Dado"], E: ["🐘", "Elefante"], F: ["🌸", "Flor"], G: ["🐱", "Gato"], H: ["🍦", "Helado"], I: ["🏝️", "Isla"], J: ["🦒", "Jirafa"], K: ["🐨", "Koala"], L: ["🦁", "León"], M: ["🦋", "Mariposa"], N: ["☁️", "Nube"], "Ñ": ["🐦", "Ñandú"], O: ["🐻", "Oso"], P: ["🐶", "Perro"], Q: ["🧀", "Queso"], R: ["🐭", "Ratón"], S: ["☀️", "Sol"], T: ["🐢", "Tortuga"], U: ["🍇", "Uvas"], V: ["🐮", "Vaca"], W: ["🧇", "Waffle"], X: ["🎼", "Xilófono"], Y: ["🪀", "Yoyó"], Z: ["🦊", "Zorro"]};
    const PAL = ["#a855e0", "#f0506e", "#3fb56b", "#f59a1f", "#22a9d0", "#7d5be0"];
    const $ = id => document.getElementById(id);
    let soundOn = true, mode = "learn", cur = null, target = null, lock = false, speakText = "";
    const seen = new Set(), keys = {};

    function say(t, force) {
      speakText = t;
      try {
        if (!(soundOn || force) || !window.speechSynthesis) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(t); u.lang = "es-MX"; u.rate = .8; u.pitch = 1.3;
        speechSynthesis.speak(u);
      } catch (e) { }
    }
    const phrase = l => l.toLowerCase() + " de " + W[l][1].toLowerCase();
    function bounce(el) {el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop")}
    function show(id) {document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); window.scrollTo(0, 0)}
    function burst() {
      const E = ["⭐", "🎉", "✨", "🌈"];
      for (let i = 0; i < 14; i++) {
        const s = document.createElement("span"); s.className = "cf"; s.textContent = E[i % 4];
        s.style.left = "50%"; s.style.top = "40%";
        s.style.setProperty("--dx", (Math.random() * 500 - 250) + "px"); s.style.setProperty("--dy", (Math.random() * -300 - 40) + "px");
        document.body.appendChild(s); setTimeout(() => s.remove(), 1200);
      }
    }

    // portada: amigos
    ["A", "B", "E", "G", "L", "O", "P", "S", "T", "Z"].forEach((l, i) => {
      const b = document.createElement("button"); b.className = "fr"; b.style.setProperty("--c", ["#f2b632", "#f0506e", "#5ccb5a", "#22a9d0", "#a855e0"][i % 5]);
      b.innerHTML = W[l][0] + "<i>" + l + "</i>"; b.setAttribute("aria-label", W[l][1]);
      b.onclick = () => {bounce(b); start("learn", l)};
      $("friends").appendChild(b);
    });
    document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => start(b.dataset.m));
    $("menu").onclick = () => {show("home"); window.speechSynthesis && speechSynthesis.cancel()};
    document.querySelectorAll(".snd").forEach(b => b.onclick = () => {
      soundOn = !soundOn; document.querySelectorAll(".snd").forEach(x => x.textContent = soundOn ? "🔊" : "🔇");
      if (!soundOn && window.speechSynthesis) speechSynthesis.cancel();
    });

    // juego: todas las letras a la vista
    LET.forEach((l, i) => {
      const b = document.createElement("button"); b.className = "k" + ("AEIOU".includes(l) ? " v" : "");
      b.textContent = l; b.style.setProperty("--c", PAL[i % 6]); b.setAttribute("aria-label", "Letra " + l);
      b.onclick = () => tap(l, b); keys[l] = b; $("grid").appendChild(b);
    });
    function card(l, word) {
      const i = LET.indexOf(l);
      $("hero").innerHTML = '<div class="big" id="bigc" style="--c:' + PAL[i % 6] + '"><span class="st' + (seen.has(l) ? " on" : "") + '">⭐</span><div class="L">' + l + "<i>" + l.toLowerCase() + '</i></div><div class="e">' + W[l][0] + '</div><div class="wd">' + word + '</div><button class="sp" id="sp" aria-label="Escuchar">🔊</button></div>';
      $("sp").onclick = e => {e.stopPropagation(); say(speakText, true); bounce($("bigc"))};
      $("bigc").onclick = () => {say(speakText, true); bounce($("bigc"))};
      bounce($("bigc"));
    }
    function mark(l) {
      seen.add(l); keys[l].classList.add("seen"); $("stars").textContent = "⭐ " + seen.size + "/27";
      if (seen.size === 27) setTimeout(() => {burst(); say("¡Felicidades! ¡Conoces todo el abecedario!", true)}, 2400)
    }
    function sel(l) {Object.values(keys).forEach(k => k.classList.remove("sel")); if (l) keys[l].classList.add("sel")}
    function start(m, l) {
      mode = m; lock = false; show("game");
      $("game").classList.toggle("vow", m === "vow");
      $("ttl").textContent = {learn: "Toca y escucha", find: "Encuentra la letra", vow: "Las vocales"}[m];
      $("stars").textContent = "⭐ " + seen.size + "/27";
      if (m === "find") next(); else pick(l || (m === "vow" ? "A" : "A"));
    }
    function pick(l) {cur = l; mark(l); sel(l); card(l, W[l][1]); say(phrase(l))}
    function next() {
      const pool = LET.filter(l => !seen.has(l)), p = pool.length ? pool : LET;
      target = p[Math.floor(Math.random() * p.length)]; sel(null);
      card(target, "¿Dónde está?"); say("Encuentra la letra " + target.toLowerCase());
    }
    function tap(l, b) {
      if (lock) return;
      if (mode !== "find") return pick(l);
      if (l === target) {
        lock = true; mark(l); sel(l); burst(); card(l, W[l][1]); say("¡Muy bien! " + phrase(l));
        setTimeout(() => {lock = false; if (seen.size < 27) next()}, 2600);
      } else {
        b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); say("Inténtalo otra vez");
      }
    }
  </script>
</body>

</html>
