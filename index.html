<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Abecedario Kids</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --b1: #5fd0f7;
      --b2: #2f7fd6;
      --ink: #fff;
      --pink: #f0506e;
      --deep: #3f56b8;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
      color: var(--ink);
      background: var(--b2) radial-gradient(ellipse at 50% 30%, var(--b1), var(--b2) 75%) fixed;
      overflow-x: hidden
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: 0;
      color: inherit;
      background: none
    }

    button:focus-visible {
      outline: 4px solid #ffe45c;
      outline-offset: 3px
    }

    .screen {
      display: none;
      min-height: 100vh;
      flex-direction: column;
      padding: 14px clamp(12px, 3vw, 32px) 28px;
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto
    }

    .screen.on {
      display: flex
    }

    h2 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      font-weight: 700;
      text-shadow: 0 2px 0 rgba(0, 0, 0, .12)
    }

    /* barra */
    .nav {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 40% 60% 50% 50%;
      background: #3ed17a;
      font-size: 2rem;
      font-weight: 700;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 0 #1f9c54;
      flex: none;
      transform: rotate(-6deg)
    }

    .logo span {
      color: #ffe45c;
      font-size: 1.3rem;
      margin-top: -10px
    }

    .tabs {
      display: flex;
      gap: clamp(2px, 2vw, 18px);
      margin-left: auto
    }

    .tab {
      width: clamp(44px, 11vw, 72px);
      height: clamp(44px, 11vw, 72px);
      border-radius: 14px;
      font-size: clamp(1.4rem, 5vw, 2rem);
      display: grid;
      place-items: center;
      transition: transform .12s
    }

    .tab:active {
      transform: scale(.88)
    }

    .tab.sel {
      background: var(--deep);
      cursor: default
    }

    .circ {
      width: clamp(48px, 11vw, 66px);
      height: clamp(48px, 11vw, 66px);
      flex: none;
      border-radius: 50%;
      background: #fff;
      font-size: 1.6rem;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 0 rgba(0, 0, 0, .15)
    }

    .circ:active {
      transform: scale(.9)
    }

    /* portada */
    .cards {
      justify-content: center;
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 6px 4px 12px;
      scrollbar-width: none
    }

    .cards::-webkit-scrollbar,
    .friends::-webkit-scrollbar {
      display: none
    }

    .gc {
      --c1: #c26cf0;
      --c2: #7d4fe0;
      flex: 0 0 78vw;
      max-width: 340px;
      height: 200px;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      text-align: right;
      padding: 16px 18px;
      scroll-snap-align: center;
      background: linear-gradient(135deg, var(--c1), var(--c2));
      box-shadow: 0 8px 0 rgba(0, 0, 0, .14);
      transition: transform .15s
    }

    .gc:active {
      transform: scale(.97)
    }

    .gc:after {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -45%;
      height: 70%;
      background: rgba(80, 220, 160, .7);
      border-radius: 50%
    }

    .gc .t1 {
      display: block;
      font-size: 1.05rem;
      font-weight: 600;
      position: relative;
      z-index: 1
    }

    .gc .t2 {
      display: block;
      font-size: clamp(1.7rem, 7vw, 2.3rem);
      font-weight: 700;
      line-height: 1;
      position: relative;
      z-index: 1
    }

    .gc .em {
      position: absolute;
      left: 14px;
      top: 38px;
      font-size: 5.4rem;
      line-height: 1;
      z-index: 1;
      animation: bob 2.6s ease-in-out infinite
    }

    .gc .st {
      position: absolute;
      left: 8px;
      top: 8px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--pink);
      display: grid;
      place-items: center;
      z-index: 2;
      font-size: 1.1rem
    }

    .gc .go {
      position: absolute;
      left: 12px;
      bottom: 12px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #fff;
      color: #2f7fd6;
      font-size: 1.3rem;
      display: grid;
      place-items: center;
      z-index: 2
    }

    @keyframes bob {
      50% {
        transform: translateY(-8px) rotate(4deg)
      }
    }

    .friends {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 6px 4px 10px;
      scrollbar-width: none
    }

    .fr {
      --c: #f2b632;
      width: clamp(74px, 18vw, 104px);
      aspect-ratio: 1;
      flex: none;
      border-radius: 50%;
      background: var(--c);
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      display: grid;
      place-items: center;
      border: 4px solid #fff;
      box-shadow: 0 5px 0 rgba(0, 0, 0, .15);
      position: relative;
      transition: transform .15s
    }

    .fr:active {
      transform: scale(.9)
    }

    .fr i {
      position: absolute;
      right: -4px;
      bottom: -4px;
      background: #fff;
      color: var(--deep);
      font-style: normal;
      font-weight: 700;
      font-size: .95rem;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center
    }

    /* juego */
    .stars {
      background: rgba(255, 255, 255, .22);
      font-weight: 700;
      font-size: 1.2rem;
      padding: 10px 18px;
      border-radius: 30px;
      white-space: nowrap
    }

    .ttl {
      flex: 1;
      min-width: 0;
      font-size: clamp(1.05rem, 4.5vw, 1.6rem);
      font-weight: 700;
      text-shadow: 0 2px 0 rgba(0, 0, 0, .12);
      line-height: 1.05
    }

    .gm {
      display: grid;
      gap: 18px;
      grid-template-columns: 1fr;
      justify-items: center;
      align-items: start
    }

    .big {
      --c: #a855e0;
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 460px;
      min-height: 210px;
      border-radius: 28px;
      padding: 14px 16px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr auto;
      align-items: center;
      text-align: center;
      background: linear-gradient(135deg, color-mix(in srgb, var(--c), #fff 24%), var(--c));
      box-shadow: 0 8px 0 rgba(0, 0, 0, .16)
    }

    .big:after {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -38%;
      height: 55%;
      background: rgba(80, 220, 160, .55);
      border-radius: 50%
    }

    .big>* {
      position: relative;
      z-index: 1
    }

    .big .L {
      padding: 0;
      font-size: clamp(4.5rem, 20vw, 8rem);
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 5px 0 rgba(0, 0, 0, .18)
    }

    .big .L i {
      font-style: normal;
      font-size: .55em;
      opacity: .8
    }

    .big .e {
      font-size: clamp(4rem, 17vw, 7rem);
      line-height: 1
    }

    .big .wd {
      grid-column: 1/3;
      font-size: clamp(1.8rem, 8vw, 2.8rem);
      font-weight: 700;
      text-shadow: 0 3px 0 rgba(0, 0, 0, .18)
    }

    .big .st {
      position: absolute;
      left: 10px;
      top: 10px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--pink);
      display: grid;
      place-items: center;
      opacity: .5;
      transition: .2s
    }

    .big .st.on {
      opacity: 1
    }

    .big .dots {
      position: absolute;
      right: 14px;
      top: 16px;
      display: flex;
      gap: 6px
    }

    .dots i {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 3px solid #fff
    }

    .dots i.f {
      background: #fff
    }

    .big.ph {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px
    }

    .grid {
      width: 100%;
      max-width: 520px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(6px, 1.6vw, 10px)
    }

    .k {
      --c: #a855e0;
      aspect-ratio: 1;
      border-radius: 22%;
      color: #fff;
      font-weight: 700;
      font-size: clamp(1.3rem, 6.2vw, 2.3rem);
      position: relative;
      text-shadow: 0 2px 0 rgba(0, 0, 0, .2);
      background: linear-gradient(color-mix(in srgb, var(--c), #fff 25%), var(--c));
      box-shadow: 0 5px 0 color-mix(in srgb, var(--c), #000 32%);
      transition: transform .12s, opacity .2s
    }

    .k:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 color-mix(in srgb, var(--c), #000 32%)
    }

    .k.sel {
      outline: 4px solid #fff;
      outline-offset: 2px;
      transform: scale(1.1);
      z-index: 2;
      animation: kp 1.4s ease-in-out infinite
    }

    .k.seen:after {
      content: "★";
      position: absolute;
      right: -3px;
      top: -7px;
      font-size: .6em;
      color: #ffe45c;
      text-shadow: 0 0 3px rgba(0, 0, 0, .6)
    }

    @keyframes kp {
      50% {
        transform: scale(1.22)
      }
    }

    .pop {
      animation: pp .5s
    }

    @keyframes pp {
      40% {
        transform: scale(1.06) rotate(-1.5deg)
      }
    }

    .cf {
      position: fixed;
      font-size: 1.6rem;
      pointer-events: none;
      z-index: 20;
      animation: fly 1.1s ease-out forwards
    }

    @keyframes fly {
      to {
        transform: translate(var(--dx), var(--dy)) rotate(360deg);
        opacity: 0
      }
    }

    /* copa */
    .win {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(20, 50, 120, .85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: auto
    }

    .win[hidden] {
      display: none
    }

    .wbox {
      background: linear-gradient(#fff6c9, #ffe27a);
      color: #7a4a00;
      border-radius: 32px;
      padding: 22px 18px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 0 rgba(0, 0, 0, .2)
    }

    .wbox h2 {
      color: #c2410c;
      text-shadow: none
    }

    .wbox p {
      margin: 6px 0 16px;
      font-weight: 600
    }

    .cup {
      font-size: clamp(6rem, 30vw, 9rem);
      line-height: 1.3;
      padding-top: 8px;
      animation: cup 1.4s ease-in-out infinite
    }

    @keyframes cup {
      50% {
        transform: scale(1.1) rotate(4deg)
      }
    }

    .wb {
      background: #3fb56b;
      color: #fff;
      font-weight: 700;
      font-size: 1.2rem;
      padding: 10px 22px;
      border-radius: 30px;
      margin: 4px;
      box-shadow: 0 5px 0 #26864c
    }

    .wb.o {
      background: #f59a1f;
      box-shadow: 0 5px 0 #b86f0a
    }

    @media (min-width:760px) {
      .cards {
        overflow: visible;
        flex-wrap: nowrap
      }

      .gc {
        flex: 0 1 480px;
        max-width: none;
        height: 230px
      }
    }

    @media (min-width:860px) {
      .gm {
        gap: 28px
      }

      .grid {
        grid-template-columns: repeat(9, 1fr);
        max-width: none
      }

      .big {
        min-height: 340px
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <section id="home" class="screen on">
    <div class="nav">
      <div class="logo" aria-hidden="true">A<span>+</span></div>
      <div class="tabs">
        <button class="tab" data-m="learn" aria-label="Aprender letras">▶</button>
        <span class="tab sel" aria-hidden="true">📖</span>
      </div>
      <button class="circ snd" aria-label="Sonido">🔊</button>
    </div>
    <h2>¡Vamos a jugar!</h2>
    <div class="cards">
      <button class="gc" data-m="learn"><span class="st">⭐</span><span class="em">🐛</span><span class="t1">Toca y
          escucha</span><span class="t2">LAS LETRAS</span><span class="go">▶</span></button>
    </div>
    <h2>Tus amigos del abecedario</h2>
    <div class="friends" id="friends"></div>
  </section>

  <section id="game" class="screen">
    <div class="nav">
      <button class="circ" id="menu" aria-label="Inicio">🏠</button>
      <div class="ttl" id="ttl">Toca y escucha las letras</div>
      <div class="stars" id="stars">⭐ 0/27</div>
      <button class="circ" id="reset" aria-label="Reiniciar">🔄</button>
      <button class="circ snd" aria-label="Sonido">🔊</button>
    </div>
    <div class="gm">
      <div id="hero" style="width:100%;display:flex;justify-content:center"></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <div id="win" class="win" hidden>
    <div class="wbox">
      <div class="cup">🏆</div>
      <h2>¡Lo lograste!</h2>
      <p>Completaste todo el abecedario 🎉</p>
      <button class="wb" id="song">🎵 Cantar</button>
      <button class="wb" id="replay">🔄 Jugar de nuevo</button>
      <button class="wb o" id="again">Seguir jugando</button>
    </div>
  </div>

  <script>
    const LET = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
    const W = { A: ["🐝", "Abeja"], B: ["🐳", "Ballena"], C: ["🏠", "Casa"], D: ["🎲", "Dado"], E: ["🐘", "Elefante"], F: ["🌸", "Flor"], G: ["🐱", "Gato"], H: ["🍦", "Helado"], I: ["🏝️", "Isla"], J: ["🦒", "Jirafa"], K: ["🐨", "Koala"], L: ["🦁", "León"], M: ["🦋", "Mariposa"], N: ["☁️", "Nube"], "Ñ": ["🐦", "Ñandú"], O: ["🐻", "Oso"], P: ["🐶", "Perro"], Q: ["🧀", "Queso"], R: ["🐭", "Ratón"], S: ["☀️", "Sol"], T: ["🐢", "Tortuga"], U: ["🍇", "Uvas"], V: ["🐮", "Vaca"], W: ["🧇", "Waffle"], X: ["🎼", "Xilófono"], Y: ["🪀", "Yoyó"], Z: ["🦊", "Zorro"] };
    const PAL = ["#a855e0", "#f0506e", "#3fb56b", "#f59a1f", "#22a9d0", "#7d5be0"];
    const $ = id => document.getElementById(id);
    let soundOn = true, mode = "learn", cur = null;
    const seen = new Set(), keys = {};

    function say(t, force) {
      try {
        if (!(soundOn || force) || !window.speechSynthesis) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(t); u.lang = "es-MX"; u.rate = .8; u.pitch = 1.3;
        speechSynthesis.speak(u);
      } catch (e) { }
    }
    const phrase = l => l.toLowerCase() + " de " + W[l][1].toLowerCase();
    function bounce(el) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop") }
    function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); window.scrollTo(0, 0) }
    function burst() {
      const E = ["⭐", "🎉", "✨", "🌈"];
      for (let i = 0; i < 14; i++) {
        const s = document.createElement("span"); s.className = "cf"; s.textContent = E[i % 4];
        s.style.left = "50%"; s.style.top = "40%";
        s.style.setProperty("--dx", (Math.random() * 500 - 250) + "px"); s.style.setProperty("--dy", (Math.random() * -300 - 40) + "px");
        document.body.appendChild(s); setTimeout(() => s.remove(), 1200);
      }
    }

    // portada: amigos
    ["A", "B", "E", "G", "L", "O", "P", "S", "T", "Z"].forEach((l, i) => {
      const b = document.createElement("button"); b.className = "fr"; b.style.setProperty("--c", ["#f2b632", "#f0506e", "#5ccb5a", "#22a9d0", "#a855e0"][i % 5]);
      b.innerHTML = W[l][0] + "<i>" + l + "</i>"; b.setAttribute("aria-label", W[l][1]);
      b.onclick = () => { bounce(b); start("learn", l) };
      $("friends").appendChild(b);
    });
    document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => start(b.dataset.m));
    $("menu").onclick = () => { show("home"); window.speechSynthesis && speechSynthesis.cancel() };
    document.querySelectorAll(".snd").forEach(b => b.onclick = () => {
      soundOn = !soundOn; document.querySelectorAll(".snd").forEach(x => x.textContent = soundOn ? "🔊" : "🔇");
      if (!soundOn && window.speechSynthesis) speechSynthesis.cancel();
    });

    // juego: todas las letras a la vista
    LET.forEach((l, i) => {
      const b = document.createElement("button"); b.className = "k";
      b.textContent = l; b.style.setProperty("--c", PAL[i % 6]); b.setAttribute("aria-label", "Letra " + l);
      b.onclick = () => tap(l); keys[l] = b; $("grid").appendChild(b);
    });
    const NAMES = { A: "a", B: "be", C: "ce", D: "de", E: "e", F: "efe", G: "ge", H: "hache", I: "i", J: "jota", K: "ka", L: "ele", M: "eme", N: "ene", "Ñ": "eñe", O: "o", P: "pe", Q: "cu", R: "erre", S: "ese", T: "te", U: "u", V: "uve", W: "uve doble", X: "equis", Y: "ye", Z: "zeta" };
    const stg = {};
    function card(l, word, dots) {
      const i = LET.indexOf(l);
      $("hero").innerHTML = '<div class="big" id="bigc" style="--c:' + PAL[i % 6] + '"><span class="st' + (seen.has(l) ? " on" : "") + '">⭐</span><span class="dots"><i class="' + (dots > 0 ? "f" : "") + '"></i><i class="' + (dots > 1 ? "f" : "") + '"></i></span><button class="L" id="lt" aria-label="Letra ' + l + '">' + l + "<i>" + l.toLowerCase() + '</i></button><div class="e">' + W[l][0] + '</div><div class="wd">' + word + '</div></div>';
      $("lt").onclick = () => bounce($("bigc"));
      $("bigc").onclick = () => bounce($("bigc"));
      bounce($("bigc"));
    }
    function placeholder() {
      cur = null; sel(null);
      $("hero").innerHTML = '<div class="big ph" style="--c:#7d5be0"><div class="e">🔤</div><div class="wd">¡Escoge una letra!</div></div>';
    }
    function learnCard(l) { const t = stg[l] || 0; card(l, t >= 2 ? W[l][1] : (t === 1 ? "¡Toca otra vez!" : "Toca la letra"), t) }
    function mark(l) {
      seen.add(l); keys[l].classList.add("seen"); $("stars").textContent = "⭐ " + seen.size + "/27";
      if (seen.size === 27) setTimeout(showWin, 1500)
    }
    function sel(l) { Object.values(keys).forEach(k => k.classList.remove("sel")); if (l) keys[l].classList.add("sel") }
    function hear() {
      if (!cur) return;
      const t = stg[cur] || 0;
      if (t === 0) { say(NAMES[cur], true); stg[cur] = 1 }
      else if (t === 1) { say(W[cur][1], true); stg[cur] = 2; mark(cur) }
      else say(phrase(cur), true);
      learnCard(cur);
    }
    function start(m, l) {
      mode = "learn"; show("game");
      $("stars").textContent = "⭐ " + seen.size + "/27";
      if (l) pick(l); else placeholder();
    }
    function pick(l) { cur = l; sel(l); learnCard(l) }
    function tap(l) { l === cur ? hear() : pick(l) }

    // copa y canción final

    // 🎵 TU CANCIÓN: carpeta "cancion" junto a este archivo HTML
    const winAudio = new Audio("cancion/cancion_ganador.mp3");
    winAudio.preload = "auto";

    let singing = false, timers = [], actx = null;
    const MEL = [262, 262, 392, 392, 440, 440, 392, 349, 349, 330, 330, 294, 294, 262, 392, 392, 349, 349, 330, 330, 294, 392, 392, 349, 330, 294, 262];
    function stopSong() {
      singing = false; timers.forEach(clearTimeout); timers = [];
      winAudio.pause(); try { winAudio.currentTime = 0 } catch (e) { }
      $("song").textContent = "🎵 Cantar";
      try { speechSynthesis.cancel() } catch (e) { }
    }
    function sing() {
      stopSong(); singing = true; $("song").textContent = "⏹ Parar";
      winAudio.onended = stopSong;
      // si no se encuentra el archivo, suena la melodía de respaldo
      winAudio.onerror = () => { if (singing) singBackup() };
      const p = winAudio.play();
      if (p && p.catch) p.catch(err => {
        if (err && err.name === "NotAllowedError") stopSong();   // el navegador pidió un toque: queda el botón "Cantar"
        else if (singing) singBackup();
      });
    }
    // melodía de respaldo (solo si falla el mp3)
    function tone(f) { if (!actx) return; const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime; o.type = "triangle"; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + .6); o.connect(g); g.connect(actx.destination); o.start(); o.stop(t + .65) }
    function singBackup() {
      stopSong(); singing = true; $("song").textContent = "⏹ Parar";
      try { actx = actx || new (window.AudioContext || window.webkitAudioContext)() } catch (e) { actx = null }
      LET.forEach((l, i) => timers.push(setTimeout(() => {
        tone(MEL[i]);
        try { if (window.speechSynthesis) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(NAMES[l]); u.lang = "es-MX"; u.rate = 1.15; u.pitch = 1.4; speechSynthesis.speak(u) } } catch (e) { }
      }, i * 720 + Math.floor(i / 7) * 350)));
      timers.push(setTimeout(stopSong, 27 * 720 + 1900));
    }
    function showWin() { burst(); $("win").hidden = false; if (soundOn) sing() }
    $("song").onclick = () => singing ? stopSong() : sing();
    $("again").onclick = () => { stopSong(); $("win").hidden = true };

    function resetGame() {
      stopSong(); $("win").hidden = true;
      seen.clear(); for (const k in stg) delete stg[k];
      Object.values(keys).forEach(k => k.classList.remove("seen", "sel"));
      cur = null;
      try { speechSynthesis.cancel() } catch (e) { }
      start(mode);
    }
    $("reset").onclick = resetGame;
    $("replay").onclick = resetGame;
  </script>
</body>
